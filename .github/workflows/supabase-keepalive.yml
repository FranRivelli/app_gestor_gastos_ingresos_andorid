name: Supabase keep-alive

# El plan gratis de Supabase pausa el proyecto tras ~7 días sin actividad.
# Este job hace una request barata a la API cada 3 días para que cuente como
# actividad. Usa los secrets SUPABASE_URL y SUPABASE_PUBLISHABLE_KEY del repo
# (el repo es público: no poner valores acá).

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la API de Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/categorias?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "HTTP $status"
          if [ "$status" -ge 500 ] || [ "$status" -eq 000 ]; then exit 1; fi
